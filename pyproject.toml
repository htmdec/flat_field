[project]
name = "flat-field"
version = "0.1.0"
description = "X-ray area-detector flat-field calibration from amorphous scattering (pyFAI), with versioned publishing to the data.htmdec.org portal."
readme = "README.md"
requires-python = ">=3.11,<3.15"
dependencies = [
    "pyFAI>=2025.12",
    "fabio>=2025.10",
    "silx>=2.2",
    "h5py>=3.11,<4",
    "hdf5plugin>=5",
    "numpy>=2",
    "matplotlib>=3.9",
    # pyFAI's interactive Jupyter calibration widget
    "ipympl>=0.9",
    "ipywidgets>=8",
    # pyFAI.gui.cli_calibration imports silx.gui.qt, which needs a Qt binding
    "pyside6-essentials>=6.7",
    "girder-client>=3.2",
    "python-dotenv>=1.0",
]

[dependency-groups]
dev = [
    "jupyterlab>=4",
    "ipykernel>=6",
    "nbclient>=0.10",
    "nbformat>=5.10",
    "pytest>=8",
    "ruff>=0.6",
    "nbstripout>=0.9.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/flat_field"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]
ignore = ["B008"]  # extract_cpt keeps the tutorial's signature
